<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="やりすぎヒーロー伝説＆ドリームストーリー">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="HEROQUEST｜ブラウザで遊べる無料ミニゲーム｜やりすぎヒーロー伝説＆ドリームストーリー">
    <meta property="og:description" content="モンスターを倒して進む、ブラウザで遊べる無料のミニゲーム。登録なしで、数分で気軽に遊べます。">
    <meta property="og:url" content="https://arechat.github.io/study124/game/index2.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="HEROQUEST｜ブラウザで遊べる無料ミニゲーム｜やりすぎヒーロー伝説＆ドリームストーリー">
    <meta name="twitter:description" content="モンスターを倒して進む、ブラウザで遊べる無料のミニゲーム。登録なしで、数分で気軽に遊べます。">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style2.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div id="game-container">
        <!-- ステータスウィンドウ -->
        <div id="status-window">
            <div id="hero-status-container"></div>
        </div>

        <!-- バトルフィールド -->
        <canvas id="battle-canvas" width="800" height="450"></canvas>

        <!-- コマンドウィンドウ -->
        <div id="command-window">
            <div id="command-char-name"></div>
            <div id="command-grid">
                <div class="command-item" data-index="0">こうげき</div>
                <div class="command-item" data-index="1">とくぎ</div>
                <div class="command-item" data-index="2">じゅもん</div>
                <div class="command-item" data-index="3">どうぐ</div>
                <div class="command-item" data-index="4">ぼうぎょ</div>
                <div class="command-item" data-index="5">そうび</div>
            </div>
            <div id="command-cursor">▶</div>
        </div>

        <!-- サブメニューウィンドウ -->
        <div id="submenu-window">
            <div id="submenu-title"></div>
            <div id="submenu-items"></div>
            <div id="submenu-cursor">▶</div>
        </div>

        <!-- メッセージウィンドウ -->
        <div id="message-window">
            <div id="message-text"></div>
        </div>
    </div>

    <audio id="bgm" loop></audio>

    <!-- 保存・ロードボタン -->
    <div id="save-load-buttons">
        <button id="save-button">ゲーム保存</button>
        <button id="load-button">ゲームロード</button>
    </div>

    <script src="js/game.js"></script>
    <script src="js/index2.js"></script>

<p style="text-align:center;font-size:.85em;margin:1.5em 0 1em;position:relative;z-index:5"><a href="../about.html" style="color:#00e0ff">はじめての方へ（紹介ページ）</a></p>
</body>
</html>
